[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "miniagent"
version = "0.1.0"
description = "A small deterministic runtime for local language models"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
dspy = ["dspy>=3.3.1,<3.4"]
examples = ["Flask>=3.1,<4"]
local = [
    "torch>=2.5,<3",
    "transformers>=4.57,<5",
    "tokenizers>=0.22,<0.24",
    "safetensors>=0.4,<1",
    "accelerate>=1,<2",
]

[project.scripts]
miniagent = "miniagent.cli:main"

[tool.setuptools.packages.find]
include = ["miniagent*"]

[tool.setuptools.package-data]
"miniagent.prompts" = ["*.md"]
"miniagent.web" = ["static/*.html", "static/*.css", "static/*.js"]
